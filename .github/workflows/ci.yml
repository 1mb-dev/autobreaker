name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A Dependabot auto-merge is pushed by GITHUB_TOKEN, which starts no push run, so main is
  # unverified until the next daily run. Dispatch verifies it on demand.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: 1mb-dev/.github/.github/workflows/ci-go.yml@feat/coverage-packages
    with:
      # Examples are main packages with no tests; counting them would make the gate track
      # how many examples exist rather than how well the library is tested.
      coverage-packages: "./internal/..."
      coverage-threshold: 99
